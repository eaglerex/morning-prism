<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>칼럼 붙여넣기 · 모닝 프리즘</title>
<style>
body{background:#0b0d12;color:#e8ecf4;font-family:system-ui,sans-serif;padding:16px;max-width:640px;margin:auto;line-height:1.5}
h1{font-size:20px}label{display:block;margin:12px 0 4px;color:#9aa4b8;font-size:14px}
textarea,input{width:100%;box-sizing:border-box;background:#161a23;color:#e8ecf4;border:1px solid #2a3040;border-radius:10px;padding:10px;font-size:15px}
textarea{min-height:220px}button,a.b{display:inline-block;background:#3b82f6;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin:8px 8px 0 0;text-decoration:none}
.g{background:#2a3040}ol{padding-left:20px;color:#c3cada}small{color:#9aa4b8}#msg{margin-top:10px;color:#8bd}
</style></head><body>
<h1>📥 칼럼 붙여넣기</h1>
<p><small>신문 칼럼·기사 요약을 붙여 넣으면, 이 휴대폰에서 암호화해 드립니다. 암호화된 결과를 GitHub에 올리면 다음 날 아침 브리핑에 반영돼요. 원문은 공개되지 않아요.</small></p>
<label for="d">반영할 브리핑 날짜</label><input id="d" type="date">
<label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="off" placeholder="보관함 비밀번호">
<label for="t">붙여 넣을 내용 (매체명과 칼럼 이름을 앞에 적으면 좋아요)</label>
<textarea id="t" placeholder="예) [중앙일보 분수대] ... 본문 또는 요약 ..."></textarea>
<button id="go">① 암호화해서 복사</button>
<div id="msg"></div>
<div id="step2" style="display:none">
<p><b>② 아래 버튼을 눌러 GitHub 화면이 열리면, 큰 입력칸을 길게 눌러 <u>붙여넣기</u> 한 뒤 맨 아래 초록색 <b>Commit changes</b> 버튼을 두 번 누르세요.</b></p>
<a class="b" id="gh" target="_blank" rel="noopener">② GitHub 열기</a>
</div>
<script>
const $=s=>document.querySelector(s);
const kst=new Date(Date.now()+9*3600e3);const h=kst.getUTCHours();
const base=new Date(kst.getTime()+(h>=15?24*3600e3:0));
$("#d").value=base.toISOString().slice(0,10);
try{const s=JSON.parse(localStorage.getItem("mp_settings")||"{}");if(s.pw)$("#pw").value=s.pw}catch(e){}
const b64=u=>btoa(String.fromCharCode(...u));
$("#go").onclick=async()=>{
  const txt=$("#t").value.trim(),pw=$("#pw").value,d=$("#d").value;
  if(!txt||!pw||!d){$("#msg").textContent="날짜, 비밀번호, 내용을 모두 입력하세요.";return}
  const iter=300000,salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(txt)));
  const out=JSON.stringify({v:1,iter,salt:b64(salt),iv:b64(iv),data:b64(ct)});
  try{await navigator.clipboard.writeText(out);$("#msg").textContent="암호화해서 복사했어요. 이제 ②를 누르세요. ("+out.length+"자)"}
  catch(e){const ta=document.createElement("textarea");ta.value=out;document.body.append(ta);ta.select();document.execCommand("copy");ta.remove();$("#msg").textContent="복사했어요. 이제 ②를 누르세요."}
  const name=d+"-"+new Date().toISOString().slice(11,19).replace(/:/g,"")+".enc.json";
  $("#gh").href="https://github.com/eaglerex/morning-prism/new/main/inbox?filename="+encodeURIComponent(name);
  $("#step2").style.display="block";
};
</script></body></html>
